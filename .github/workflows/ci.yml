name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked (not --frozen) fails the build if uv.lock is out of date
      # relative to pyproject.toml, and --all-extras installs both the
      # `dev` group (ruff/mypy/pytest/hypothesis) and the `service` group
      # (fastapi/sqlalchemy/alembic/psycopg/uvicorn/argon2-cffi/...) --
      # every step below needs one or both.
      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Ruff
        run: uv run ruff check src tests examples migrations

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Full project CI gate
        run: make ci

      - name: Deterministic SkillRewind demo
        run: make demo