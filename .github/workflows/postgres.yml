name: PostgreSQL Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: skillrewind
          POSTGRES_PASSWORD: skillrewind_test
          POSTGRES_DB: skillrewind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillrewind -d skillrewind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SKILLREWIND_TEST_POSTGRES_URL: >-
        postgresql+psycopg://skillrewind:skillrewind_test@localhost:5432/skillrewind_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked (not --frozen) fails the build if uv.lock is out of date,
      # and --all-extras installs the `service` group -- specifically
      # psycopg[binary], sqlalchemy, and alembic, which the
      # SKILLREWIND_TEST_POSTGRES_URL-gated tests below require just to be
      # importable, let alone to run for real instead of skipping.
      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Run PostgreSQL integration tests
        run: uv run pytest -q -rs

      - name: Fail if the PostgreSQL-gated tests were skipped
        run: |
          uv run pytest \
            tests/integration/test_service_persistence.py::test_postgres_migration_and_schema_current \
            tests/integration/test_service_replay_job_handler.py::test_postgres_concurrent_replay_job_claims_are_mutually_exclusive \
            -v -rs --no-header | tee /tmp/postgres-gated.log
          if grep -q "SKIPPED" /tmp/postgres-gated.log; then
            echo "::error::PostgreSQL-gated test(s) were skipped in CI, where SKILLREWIND_TEST_POSTGRES_URL is configured and psycopg is installed. This must never skip in this workflow -- see .github/workflows/postgres.yml."
            exit 1
          fi