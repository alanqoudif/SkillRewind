[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrewind"
version = "0.3.0a1"
description = "Traceable, revocable, and rebuildable persistent learning for AI agents (research and integration preview)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Faisal Ali Said Al-Anqoudi"}
]
keywords = ["llm-agents", "agent-skills", "provenance", "revocation", "ai-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security"
]
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
service = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "sse-starlette>=2.0",
    "uvicorn>=0.29",
]

[project.scripts]
skillrewind = "skillrewind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillrewind = [
  "py.typed",
  "persistence/service/migrations/README",
  "persistence/service/migrations/env.py",
  "persistence/service/migrations/script.py.mako",
  "persistence/service/migrations/versions/*.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests/", "examples/", "rewindbench/"]
