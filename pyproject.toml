[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrewind"
version = "0.1.0"
description = "Recorded-lineage baseline and research schemas for revoking persistent AI-agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Faisal Ali Said Al-Anqoudi"}
]
keywords = ["llm-agents", "agent-skills", "provenance", "revocation", "ai-security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security"
]
dependencies = []

[project.scripts]
skillrewind = "skillrewind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillrewind = ["py.typed"]
