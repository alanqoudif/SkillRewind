[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrewind"
version = "0.2.0"
description = "Recovering hidden influence lineage for verified revocation in self-evolving LLM agents (research preview)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Faisal Ali Said Al-Anqoudi"}
]
keywords = ["llm-agents", "agent-skills", "provenance", "revocation", "ai-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security"
]
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
skillrewind = "skillrewind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillrewind = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests/", "examples/", "rewindbench/"]
